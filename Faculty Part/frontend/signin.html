<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com 'unsafe-inline'; style-src 'self' https://api.fontshare.com https://fonts.googleapis.com 'unsafe-inline'; font-src https://cdn.fontshare.com https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';">
    <title>Sign in · ClassAI</title>
    <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@700,800&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/base.css">
    <link rel="stylesheet" href="/static/signin.css">
    <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js" crossorigin="anonymous"></script>
</head>
<body class="signin-body">
    <header class="signin-top">
        <a href="/" class="brand" aria-label="ClassAI home">
            <span class="brand-mark" aria-hidden="true">C</span>
            <span class="brand-name">ClassAI</span>
        </a>
    </header>

    <main class="signin-shell">
        <div class="signin-card">
            <h1 class="signin-title">Sign in</h1>
            <p class="signin-sub">Use the account your administrator set up. Your role decides which documents you can search.</p>

            <form id="signinForm" novalidate>
                <div class="signin-field">
                    <label class="signin-label" for="emailInput">Email</label>
                    <input id="emailInput" class="signin-input" type="email"
                           placeholder="you@nmims.edu" autocomplete="email" required>
                </div>

                <div class="signin-field">
                    <label class="signin-label" for="passwordInput">Password</label>
                    <div class="signin-input-wrap">
                        <input id="passwordInput" class="signin-input" type="password"
                               autocomplete="current-password" required>
                        <button type="button" class="signin-eye-toggle" id="eyeToggle" aria-label="Show password">
                            <i data-lucide="eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <p class="signin-error" id="signinError" role="alert" aria-live="polite"></p>

                <button type="submit" class="btn btn-primary signin-submit" id="signinBtn">Sign in</button>
            </form>
        </div>
    </main>

    <script src="/static/signin.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
